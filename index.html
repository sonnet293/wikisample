<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>샘플위키</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="top-bar">
      <nav class="top-nav">
        <a class="logo" href="#/w/%EB%8C%80%EB%AC%B8"><i class="fa-solid fa-seedling"></i><span>샘플위키</span></a>
        <div class="search-area">
          <form class="search-box" id="search-form" autocomplete="off">
            <input type="search" id="search-input" placeholder="여기에서 검색" aria-label="문서 제목" />
            <button type="submit" class="search-btn" title="검색" aria-label="검색"><i class="fa-solid fa-magnifying-glass"></i></button>
            <button type="submit" class="search-btn" title="이동" aria-label="이동"><i class="fa-solid fa-arrow-right"></i></button>
          </form>
        </div>
        <div class="user-area">
          <button type="button" class="nav-link user-btn" id="user-btn" aria-label="계정" aria-haspopup="true" aria-expanded="false"><i class="fa-solid fa-user"></i></button>
          <div class="user-menu" id="user-menu" role="menu" hidden></div>
        </div>
      </nav>
    </header>

    <main class="container">
      <article class="wiki-article" id="app"></article>
    </main>

    <div class="toast-area" id="toast-area"></div>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
